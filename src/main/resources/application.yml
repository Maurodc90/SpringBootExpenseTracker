server:
  port: 8080 # port the embedded server listens on

spring:
  datasource:
    url: jdbc:postgresql://ep-steep-grass-b1kkc352-pooler.c-5.eu-central-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME} # set as an environment variable, not hardcoded
    password: ${DB_PASSWORD} # set as an environment variable, not hardcoded
  jpa:
    hibernate:
      ddl-auto: update # update the schema to match the entities, never wipe data (safe for PostgreSQL)
    show-sql: true # logs the generated SQL to the console for debugging
    database-platform: org.hibernate.dialect.PostgreSQLDialect